<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SLOY — Слой не найден</title>
    <style>
        :root {
            --bg: #020617;
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 400px;
            width: 90%;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: appear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 7rem;
            font-weight: 900;
            font-style: italic;
            line-height: 0.9;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        code {
            background: rgba(34, 211, 238, 0.1);
            color: var(--accent);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--text-main);
            color: var(--bg);
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 1.2rem;
            font-weight: 800;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(34, 211, 238, 0.3);
        }

        .btn:active { transform: translateY(0); }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <div class="ui-layer">
        <h1>404</h1>
        <p>Слой <code id="path">/unknown</code> провалился в текстуры межпространственного перехода.</p>
        
        <a href="/" class="btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H9v8H5a2 2 0 0 1-2-2z"/></svg>
            НА ГЛАВНУЮ
        </a>

        <div class="footer-note">System Status: Void</div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const pathEl = document.getElementById('path');

        pathEl.textContent = window.location.pathname === '/' ? '/lost-sector' : window.location.pathname;

        let w, h, stars = [];
        let mouse = { x: 0, y: 0, active: false };
        
        // Состояние кота
        const cat = {
            x: 0, y: 0, 
            targetX: 0, 
            size: 0,
            angle: 0,
            fallSpeed: 3
        };

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            
            cat.x = w / 2;
            cat.targetX = w / 2;
            cat.size = Math.min(w, h) * 0.08;
            
            stars = Array.from({ length: 140 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                s: Math.random() * 2,
                p: Math.random() * Math.PI * 2
            }));
        }

        function drawPortal(x, y, radius, pulse) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(cat.angle * pulse);
            
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
            g.addColorStop(0, 'rgba(34, 211, 238, 0.3)');
            g.addColorStop(0.6, 'rgba(59, 130, 246, 0.2)');
            g.addColorStop(1, 'transparent');

            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // Кольцо портала
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.setLineDash([radius/3, radius/6]);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawCat(x, y, s) {
            ctx.save();
            ctx.translate(x, y);
            
            // Тело
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.ellipse(0, 0, s*0.6, s*0.7, 0, 0, Math.PI*2);
            ctx.fill();

            // Голова
            ctx.beginPath();
            ctx.arc(0, -s*0.5, s*0.45, 0, Math.PI*2);
            ctx.fill();

            // Светящиеся глаза (Cyan)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#22d3ee';
            ctx.fillStyle = '#22d3ee';
            ctx.beginPath();
            ctx.arc(-s*0.18, -s*0.55, s*0.07, 0, Math.PI*2);
            ctx.arc(s*0.18, -s*0.55, s*0.07, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function loop() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, w, h);

            // Звезды
            ctx.fillStyle = '#fff';
            stars.forEach(st => {
                const op = 0.2 + Math.abs(Math.sin(Date.now() * 0.001 + st.p)) * 0.8;
                ctx.globalAlpha = op;
                ctx.fillRect(st.x, st.y, st.s, st.s);
            });
            ctx.globalAlpha = 1;

            cat.angle += 0.02;
            const topY = h * 0.12;
            const botY = h * 0.88;
            const pRadius = Math.min(w, h) * 0.15;

            drawPortal(w/2, topY, pRadius * 0.7, -1);
            drawPortal(w/2, botY, pRadius, 1);

            // Логика следования за мышью (плавно)
            if (mouse.active) {
                cat.targetX = mouse.x;
            } else {
                cat.targetX = w / 2;
            }
            cat.x += (cat.targetX - cat.x) * 0.08;

            // Падение
            cat.y += cat.fallSpeed;
            if (cat.y > botY) {
                cat.y = topY; // Телепортация наверх
            }

            drawCat(cat.x, cat.y, cat.size);

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', init);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.active = true;
        });
        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('touchstart', e => {
            mouse.x = e.touches[0].clientX;
            mouse.active = true;
        });

        init();
        cat.y = h * 0.2; // Стартовая позиция
        loop();
    </script>
</body>
</html>
